name: Build

on:
  pull_request:
    branches:
      - develop
      - master

    types:
      - opened
      - synchronize
      - reopened

jobs:
  build:
    name: Build
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Assemble libraries
        run: |
          ./gradlew \
            :tdl-coroutines:bundleAndroidMainAar \
            :tdl-coroutines:iosArm64Cinterop-mainKlib \
            :tdl-coroutines:iosArm64Klib \
            :tdl-coroutines:iosArm64SimulatorCinterop-mainKlib \
            :tdl-coroutines:iosArm64SimulatorKlib \
            :tdl-coroutines:iosX64SimulatorCinterop-mainKlib \
            :tdl-coroutines:iosX64SimulatorKlib \
            :tdl-coroutines:jvmJar \
            :tdl-coroutines:macosArm64Cinterop-mainKlib \
            :tdl-coroutines:macosArm64Klib \
            :tdl-coroutines:macosX64Cinterop-mainKlib \
            :tdl-coroutines:macosX64Klib \
            :tdl-coroutines:mingwX64Cinterop-mainKlib \
            :tdl-coroutines:mingwX64Klib

      - name: Assemble examples
        run: |
          ./gradlew \
            :example:demo:android:assembleRelease \
            :example:demo:jvm:assemble

      - name: Check API compatibility
        run: ./gradlew :tdl-coroutines:checkKotlinAbi

  verify-android:
    name: Verify Android
    runs-on: self-hosted
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Verify
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: arm64-v8a
          script: bash .github/scripts/verify-android.sh

  verify-ios:
    name: Verify iOS Simulator ARM64
    runs-on: self-hosted
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Verify
        run: ./gradlew :example:verification:app:ios:iosSimulatorArm64Test

  verify-jvm:
    name: Verify JVM ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: build

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux ARM64
            runner: ubuntu-24.04-arm
            gradle: ./gradlew

          - platform: Linux x64
            runner: ubuntu-24.04
            gradle: ./gradlew

          - platform: macOS ARM64
            runner: self-hosted
            gradle: ./gradlew

          - platform: macOS x64
            runner: macos-15-intel
            gradle: ./gradlew

          - platform: Windows ARM64
            runner: windows-11-arm
            gradle: ./gradlew.bat

          - platform: Windows x64
            runner: windows-2025
            gradle: ./gradlew.bat

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Verify
        run: ${{ matrix.gradle }} :example:verification:app:jvm:run

  verify-macos:
    name: Verify macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: build

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ARM64
            runner: self-hosted
            task: runReleaseExecutableMacosArm64

          - arch: x64
            runner: macos-15-intel
            task: runReleaseExecutableMacosX64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Verify
        run: bash .github/scripts/verify-macos.sh "${{ matrix.task }}"

  verify-windows:
    name: Verify Windows x64
    runs-on: windows-2025
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Verify
        run: ./gradlew.bat :example:verification:app:windows:runReleaseExecutableMingwX64
