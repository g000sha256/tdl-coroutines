name: Build and publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  verify-android:
    name: Verify Android
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Verify
        uses: ./.github/actions/verify-android

  verify-ios:
    name: Verify iOS Simulator ARM64
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Verify
        run: ./gradlew :example:verification:app:ios:iosSimulatorArm64Test

  verify-jvm:
    name: Verify JVM ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux ARM64
            runner: ubuntu-22.04-arm
            gradle: ./gradlew

          - platform: Linux x64
            runner: ubuntu-22.04
            gradle: ./gradlew

          - platform: macOS ARM64
            runner: macos-26
            gradle: ./gradlew

          - platform: macOS x64
            runner: macos-26-intel
            gradle: ./gradlew

          - platform: Windows ARM64
            runner: windows-11-arm
            gradle: ./gradlew.bat

          - platform: Windows x64
            runner: windows-2025
            gradle: ./gradlew.bat

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Verify
        run: ${{ matrix.gradle }} :example:verification:app:jvm:run

  verify-linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ARM64
            name: Build Linux ARM64 verification executable
            target: linuxArm64
            task: linkReleaseExecutableLinuxArm64
            cross-compile: true

          - arch: x64
            name: Verify Linux x64
            target: linuxX64
            task: linkReleaseExecutableLinuxX64
            cross-compile: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Build verification executable
        run: ./gradlew ":example:verification:app:linux:${{ matrix.task }}"

      - name: Verify on build host
        if: ${{ !matrix.cross-compile }}
        run: ./example/verification/app/linux/build/bin/"${{ matrix.target }}"/releaseExecutable/*.kexe

      - name: Upload verification executable
        if: matrix.cross-compile
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-verification
          path: example/verification/app/linux/build/bin/${{ matrix.target }}/releaseExecutable/*.kexe
          if-no-files-found: error
          retention-days: 1

  verify-linux-arm64:
    name: Verify Linux ARM64
    if: ${{ !cancelled() && needs.verify-linux.result != 'skipped' }}
    needs: verify-linux
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Download verification executable
        uses: actions/download-artifact@v8
        with:
          name: linux-arm64-verification
          path: verification

      - name: Verify
        run: |
          chmod +x verification/*.kexe
          verification/*.kexe

  verify-macos:
    name: Verify macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ARM64
            runner: macos-26
            task: runReleaseExecutableMacosArm64

          - arch: x64
            runner: macos-26-intel
            task: runReleaseExecutableMacosX64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Verify
        run: bash ./gradlew ":example:verification:app:macos:${{ matrix.task }}"

  verify-tvos:
    name: Verify tvOS Simulator ARM64
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Verify
        run: ./gradlew :example:verification:app:tvos:tvosSimulatorArm64Test

  verify-watchos:
    name: Verify watchOS Simulator ARM64
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Verify
        run: ./gradlew :example:verification:app:watchos:watchosSimulatorArm64Test

  verify-windows:
    name: Verify Windows x64
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Verify
        run: ./gradlew.bat :example:verification:app:windows:runReleaseExecutableMingwX64

  build-and-publish:
    name: Build and publish
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

    needs:
      - verify-android
      - verify-ios
      - verify-jvm
      - verify-linux
      - verify-linux-arm64
      - verify-macos
      - verify-tvos
      - verify-watchos
      - verify-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Assemble libraries
        run: |
          ./gradlew \
            :tdl-coroutines:bundleAndroidMainAar \
            :tdl-coroutines:iosArm64Cinterop-mainKlib \
            :tdl-coroutines:iosArm64Klib \
            :tdl-coroutines:iosArm64SimulatorCinterop-mainKlib \
            :tdl-coroutines:iosArm64SimulatorKlib \
            :tdl-coroutines:iosX64SimulatorCinterop-mainKlib \
            :tdl-coroutines:iosX64SimulatorKlib \
            :tdl-coroutines:jvmJar \
            :tdl-coroutines:linuxArm64Cinterop-mainKlib \
            :tdl-coroutines:linuxArm64Klib \
            :tdl-coroutines:linuxX64Cinterop-mainKlib \
            :tdl-coroutines:linuxX64Klib \
            :tdl-coroutines:macosArm64Cinterop-mainKlib \
            :tdl-coroutines:macosArm64Klib \
            :tdl-coroutines:macosX64Cinterop-mainKlib \
            :tdl-coroutines:macosX64Klib \
            :tdl-coroutines:mingwX64Cinterop-mainKlib \
            :tdl-coroutines:mingwX64Klib \
            :tdl-coroutines:tvosArm64Cinterop-mainKlib \
            :tdl-coroutines:tvosArm64Klib \
            :tdl-coroutines:tvosSimulatorArm64Cinterop-mainKlib \
            :tdl-coroutines:tvosSimulatorArm64Klib \
            :tdl-coroutines:tvosX64Cinterop-mainKlib \
            :tdl-coroutines:tvosX64Klib \
            :tdl-coroutines:watchosArm64Cinterop-mainKlib \
            :tdl-coroutines:watchosArm64Klib \
            :tdl-coroutines:watchosDeviceArm64Cinterop-mainKlib \
            :tdl-coroutines:watchosDeviceArm64Klib \
            :tdl-coroutines:watchosSimulatorArm64Cinterop-mainKlib \
            :tdl-coroutines:watchosSimulatorArm64Klib \
            :tdl-coroutines:watchosX64Cinterop-mainKlib \
            :tdl-coroutines:watchosX64Klib

      - name: Assemble examples
        run: |
          ./gradlew \
            :example:demo:android:assembleRelease \
            :example:demo:jvm:assemble

      - name: Check API compatibility
        run: ./gradlew :tdl-coroutines:checkKotlinAbi

      - name: Publish
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

        run: ./gradlew :tdl-coroutines:publish
