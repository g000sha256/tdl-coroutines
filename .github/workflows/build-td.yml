        run: shasum -a 256 tdl-coroutines/generated/ios/x64Simulator/libs/*.a

      - name: Commit and push
        if: github.event_name == 'push' || inputs.commit
        uses: ./.github/actions/commit-and-push
        with:
          message: TDLib for iOS x64 Simulator
          add: tdl-coroutines

  build-macos-arm64:
    name: Build macOS ARM64
    if: >-
      !cancelled() &&
      (needs.run-generator.result == 'success' || needs.run-generator.result == 'skipped') &&
      (github.event_name == 'push' || inputs.build-macos-arm64)
    needs: run-generator
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TDL_CHECKOUT_REF }}
          lfs: true
          submodules: true

      - name: Apply generated API
        if: github.event_name == 'workflow_dispatch' && inputs.commit == false && inputs.run-generator
        uses: ./.github/actions/apply-generated-api

      - name: Checkout zlib
        uses: actions/checkout@v7
        with:
          repository: madler/zlib
          ref: ${{ env.TDL_ZLIB_VERSION }}
          path: native-dependencies/zlib

      - name: Clean submodule
        run: |
          cd td
          git clean -ffdx

      - name: Set up dependencies
        run: brew install gperf cmake coreutils

      - name: Apply patch
        run: git apply .github/patches/macos-arm64.patch

      - name: Build OpenSSL
        run: |
          cd td/example/ios
          ./build-openssl.sh

      - name: Build zlib
        run: |
          bash .github/scripts/build-zlib-apple.sh \
            native-dependencies/zlib "$RUNNER_TEMP/zlib-macos-arm64" \
            macosx arm64 "$TDL_MACOS_DEPLOYMENT_TARGET"

      - name: Build TDLib
        run: |
          cd td
          mkdir build
          cd build
          cmake -DTD_GENERATE_SOURCE_FILES=ON ..
          cmake --build .
          cd ../example/ios
          ./build.sh \
            "-DZLIB_INCLUDE_DIR=$RUNNER_TEMP/zlib-macos-arm64/install/include" \
            "-DZLIB_LIBRARY=$RUNNER_TEMP/zlib-macos-arm64/install/lib/libz.a"

      - name: Copy files
        run: |
          rm -rf tdl-coroutines/generated/macos/arm64
          mkdir -p tdl-coroutines/generated/macos/arm64/include/td/telegram
          mkdir -p tdl-coroutines/generated/macos/arm64/libs
          cp td/example/ios/build/install-macOS/include/td/telegram/tdjson_export.h tdl-coroutines/generated/macos/arm64/include/td/telegram
          cp td/example/ios/build/install-macOS/lib/*.a tdl-coroutines/generated/macos/arm64/libs
          cp td/example/ios/third_party/openssl/macOS/lib/*.a tdl-coroutines/generated/macos/arm64/libs
          cp "$RUNNER_TEMP/zlib-macos-arm64/install/lib/libz.a" tdl-coroutines/generated/macos/arm64/libs

      - name: SHA256 checksums
        run: shasum -a 256 tdl-coroutines/generated/macos/arm64/libs/*.a

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Verify
        run: bash ./gradlew :example:verification:app:macos:runReleaseExecutableMacosArm64

      - name: Commit and push
        if: github.event_name == 'push' || inputs.commit
        uses: ./.github/actions/commit-and-push
        with:
          message: TDLib for macOS ARM64
          add: tdl-coroutines

