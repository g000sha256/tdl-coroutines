name: Build TDLib

on:
  push:
    branches:
      - build-td
    paths:
      - td

  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit and push API and binaries (disable for verification only)'
        required: false
        type: boolean
        default: true

      build-android:
        description: 'Build Android'
        required: false
        type: boolean
        default: false

      build-jvm:
        description: 'Build JVM'
        required: false
        type: boolean
        default: false

      build-ios:
        description: 'Build iOS'
        required: false
        type: boolean
        default: false

      build-macos:
        description: 'Build macOS'
        required: false
        type: boolean
        default: false

      build-windows:
        description: 'Build Windows'
        required: false
        type: boolean
        default: false

env:
  TDL_CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.commit == false && github.sha || github.ref_name }}
  TDL_IOS_DEPLOYMENT_TARGET: '15.0'
  TDL_MACOS_DEPLOYMENT_TARGET: '12.0'

jobs:
  run-generator:
    name: Run generator
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TDL_CHECKOUT_REF }}
          lfs: true
          submodules: true

      - name: Clean submodule
        run: |
          cd td
          git clean -ffdx

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Assemble generator
        run: ./gradlew :tdl-coroutines-generator:assemble

      - name: Run generator
        run: ./gradlew :tdl-coroutines-generator:run

      - name: Dump API
        run: ./gradlew :tdl-coroutines:updateKotlinAbi

      - name: Prepare generated API patch
        if: github.event_name == 'workflow_dispatch' && inputs.commit == false
        run: |
          git add --all -- README.md tdl-coroutines/src/commonMainGenerated tdl-coroutines/api
          git diff --cached --binary --full-index > generated-api.patch

      - name: Upload generated API patch
        if: github.event_name == 'workflow_dispatch' && inputs.commit == false
        uses: actions/upload-artifact@v7
        with:
          name: generated-api
          path: generated-api.patch
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Commit and push
        if: github.event_name == 'push' || inputs.commit
        uses: ./.github/actions/commit-and-push
        with:
          message: Update API
          add: |
            - tdl-coroutines
            - README.md

  build-android:
    name: Build Android
    if: github.event_name == 'push' || inputs.build-android
    needs: run-generator
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TDL_CHECKOUT_REF }}
          lfs: true
          submodules: true

      - name: Apply generated API
        if: github.event_name == 'workflow_dispatch' && inputs.commit == false
        uses: ./.github/actions/apply-generated-api

      - name: Clean submodule
        run: |
          cd td
          git clean -ffdx

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Set up dependencies
        run: brew install cmake coreutils gperf openssl php

      - name: Check environment
        run: |
          cd td/example/android
          ./check-environment.sh

      - name: Fetch Android SDK
        run: |
          cd td/example/android
          ./fetch-sdk.sh

      - name: Build OpenSSL
        run: |
          cd td/example/android
          ./build-openssl.sh

      - name: Build TDLib
        run: |
          cd td/example/android
          ./build-tdlib.sh '' '' '' '' 'JSONJava'

      - name: Copy files
        run: |
          rm -rf tdl-coroutines/generated/android
          mkdir -p tdl-coroutines/generated/android
          cp -r td/example/android/tdlib/libs/* tdl-coroutines/generated/android

      - name: SHA256 checksums
        run: shasum -a 256 tdl-coroutines/generated/android/*/*.so

      - name: Verify
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: arm64-v8a
          script: bash .github/scripts/verify-android.sh

      - name: Commit and push
        if: github.event_name == 'push' || inputs.commit
        uses: ./.github/actions/commit-and-push
        with:
          message: TDLib for Android
          add: tdl-coroutines

  build-jvm-linux-arm64:
    name: Build JVM Linux ARM64
    if: github.event_name == 'push' || inputs.build-jvm
    needs: run-generator
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TDL_CHECKOUT_REF }}
          lfs: true
          submodules: true

      - name: Apply generated API
        if: github.event_name == 'workflow_dispatch' && inputs.commit == false
        uses: ./.github/actions/apply-generated-api

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          tools: none

      - name: Set up dependencies
        run: sudo apt-get install make git zlib1g-dev libssl-dev gperf cmake g++

      - name: Build TDLib
        run: |
          cd td
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=../example/java/td -DTD_ENABLE_JNI=ON ..
          cmake --build . --target install
          cd ../example/java
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=../../../tdlib -DTd_DIR:PATH=$(readlink -e ../td/lib/cmake/Td) -DTD_JSON_JAVA=ON ..
          cmake --build . --target install

      - name: Copy files
        run: |
          rm -rf tdl-coroutines/generated/jvm/linux/arm64
          mkdir -p tdl-coroutines/generated/jvm/linux/arm64
          cp td/tdlib/bin/*.so tdl-coroutines/generated/jvm/linux/arm64

      - name: SHA256 checksums
        run: shasum -a 256 tdl-coroutines/generated/jvm/linux/arm64/*.so

      - name: Verify
        run: ./gradlew :example:verification:app:jvm:run

      - name: Commit and push
        if: github.event_name == 'push' || inputs.commit
        uses: ./.github/actions/commit-and-push
        with:
          message: TDLib for JVM Linux ARM64
          add: tdl-coroutines

  build-jvm-linux-x64:
    name: Build JVM Linux x64
    if: github.event_name == 'push' || inputs.build-jvm
    needs: run-generator
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TDL_CHECKOUT_REF }}
          lfs: true
          submodules: true

      - name: Apply generated API
        if: github.event_name == 'workflow_dispatch' && inputs.commit == false
        uses: ./.github/actions/apply-generated-api

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          tools: none

      - name: Set up dependencies
        run: sudo apt-get install make git zlib1g-dev libssl-dev gperf cmake g++

      - name: Build TDLib
        run: |
          cd td
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=../example/java/td -DTD_ENABLE_JNI=ON ..
          cmake --build . --target install
          cd ../example/java
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=../../../tdlib -DTd_DIR:PATH=$(readlink -e ../td/lib/cmake/Td) -DTD_JSON_JAVA=ON ..
          cmake --build . --target install

      - name: Copy files
        run: |
          rm -rf tdl-coroutines/generated/jvm/linux/x64
          mkdir -p tdl-coroutines/generated/jvm/linux/x64
          cp td/tdlib/bin/*.so tdl-coroutines/generated/jvm/linux/x64

      - name: SHA256 checksums
        run: shasum -a 256 tdl-coroutines/generated/jvm/linux/x64/*.so

      - name: Verify
        run: ./gradlew :example:verification:app:jvm:run

      - name: Commit and push
        if: github.event_name == 'push' || inputs.commit
        uses: ./.github/actions/commit-and-push
        with:
          message: TDLib for JVM Linux x64
          add: tdl-coroutines

  build-jvm-macos-arm64:
    name: Build JVM macOS ARM64
    if: github.event_name == 'push' || inputs.build-jvm
    needs: run-generator
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TDL_CHECKOUT_REF }}
          lfs: true
          submodules: true

      - name: Apply generated API
        if: github.event_name == 'workflow_dispatch' && inputs.commit == false
        uses: ./.github/actions/apply-generated-api

      - name: Clean submodule
        run: |
          cd td
          git clean -ffdx

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Set up dependencies
        run: brew install gperf cmake coreutils openjdk

      - name: Apply patches
        run: |
          git apply .github/patches/macos-arm64.patch
          git apply .github/patches/jvm-no-libjvm.patch

      - name: Build OpenSSL
        run: |
          cd td/example/ios
          ./build-openssl.sh

      - name: Build TDLib
        run: |
          cd td
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=${TDL_MACOS_DEPLOYMENT_TARGET} -DJAVA_HOME=/opt/homebrew/opt/openjdk/libexec/openjdk.jdk/Contents/Home/ -DOPENSSL_ROOT_DIR:PATH="${GITHUB_WORKSPACE}/td/example/ios/third_party/openssl/macOS" -DOPENSSL_USE_STATIC_LIBS:BOOL=TRUE -DCMAKE_INSTALL_PREFIX:PATH=../example/java/td -DTD_ENABLE_JNI=ON ..
          cmake --build . --target install
          cd ../example/java
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=${TDL_MACOS_DEPLOYMENT_TARGET} -DJAVA_HOME=/opt/homebrew/opt/openjdk/libexec/openjdk.jdk/Contents/Home/ -DCMAKE_INSTALL_PREFIX:PATH=../../../tdlib -DTd_DIR:PATH=$(greadlink -e ../td/lib/cmake/Td) -DTD_JSON_JAVA=ON ..
          cmake --build . --target install

      - name: Copy files
        run: |
          rm -rf tdl-coroutines/generated/jvm/macos/arm64
          mkdir -p tdl-coroutines/generated/jvm/macos/arm64
          cp td/tdlib/bin/*.dylib tdl-coroutines/generated/jvm/macos/arm64

      - name: SHA256 checksums
        run: shasum -a 256 tdl-coroutines/generated/jvm/macos/arm64/*.dylib

      - name: Verify
        run: ./gradlew :example:verification:app:jvm:run

      - name: Commit and push
        if: github.event_name == 'push' || inputs.commit
        uses: ./.github/actions/commit-and-push
        with:
          message: TDLib for JVM macOS ARM64
          add: tdl-coroutines

  build-jvm-macos-x64:
    name: Build JVM macOS x64
    if: github.event_name == 'push' || inputs.build-jvm
    needs: run-generator
    runs-on: macos-26-intel
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TDL_CHECKOUT_REF }}
          lfs: true
          submodules: true

      - name: Apply generated API
        if: github.event_name == 'workflow_dispatch' && inputs.commit == false
        uses: ./.github/actions/apply-generated-api

      - name: Set up dependencies
        run: brew install gperf cmake coreutils openjdk

      - name: Apply patches
        run: |
          git apply .github/patches/macos-x64.patch
          git apply .github/patches/jvm-no-libjvm.patch

      - name: Build OpenSSL
        run: |
          cd td/example/ios
          ./build-openssl.sh

      - name: Build TDLib
        run: |
          cd td
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=${TDL_MACOS_DEPLOYMENT_TARGET} -DJAVA_HOME=/usr/local/opt/openjdk/libexec/openjdk.jdk/Contents/Home/ -DOPENSSL_ROOT_DIR:PATH="${GITHUB_WORKSPACE}/td/example/ios/third_party/openssl/macOS" -DOPENSSL_USE_STATIC_LIBS:BOOL=TRUE -DCMAKE_INSTALL_PREFIX:PATH=../example/java/td -DTD_ENABLE_JNI=ON ..
          cmake --build . --target install
          cd ../example/java
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=${TDL_MACOS_DEPLOYMENT_TARGET} -DJAVA_HOME=/usr/local/opt/openjdk/libexec/openjdk.jdk/Contents/Home/ -DCMAKE_INSTALL_PREFIX:PATH=../../../tdlib -DTd_DIR:PATH=$(greadlink -e ../td/lib/cmake/Td) -DTD_JSON_JAVA=ON ..
          cmake --build . --target install

      - name: Copy files
        run: |
          rm -rf tdl-coroutines/generated/jvm/macos/x64
          mkdir -p tdl-coroutines/generated/jvm/macos/x64
          cp td/tdlib/bin/*.dylib tdl-coroutines/generated/jvm/macos/x64

      - name: SHA256 checksums
        run: shasum -a 256 tdl-coroutines/generated/jvm/macos/x64/*.dylib

      - name: Verify
        run: ./gradlew :example:verification:app:jvm:run

      - name: Commit and push
        if: github.event_name == 'push' || inputs.commit
        uses: ./.github/actions/commit-and-push
        with:
          message: TDLib for JVM macOS x64
          add: tdl-coroutines

  build-jvm-windows-arm64:
    name: Build JVM Windows ARM64
    if: github.event_name == 'push' || inputs.build-jvm
    needs: run-generator
    runs-on: windows-11-arm
    permissions:
      contents: write

    env:
      SOURCE_DATE_EPOCH: "1"
      VCPKG_KEEP_ENV_VARS: "SOURCE_DATE_EPOCH"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TDL_CHECKOUT_REF }}
          lfs: true
          submodules: true

      - name: Apply generated API
        if: github.event_name == 'workflow_dispatch' && inputs.commit == false
        uses: ./.github/actions/apply-generated-api

      - name: Set up dependencies
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.bat
          $triplet = "triplets/arm64-windows.cmake"
          Add-Content $triplet "`nset(VCPKG_LINKER_FLAGS `"/Brepro`")"
          ./vcpkg.exe install gperf:arm64-windows openssl:arm64-windows zlib:arm64-windows

      - name: Build TDLib
        run: |
          cd td
          mkdir build
          cd build
          cmake -A ARM64 -DCMAKE_INSTALL_PREFIX:PATH=../example/java/td -DTD_ENABLE_JNI=ON -DCMAKE_TOOLCHAIN_FILE:FILEPATH=../../vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_SHARED_LINKER_FLAGS="/Brepro" ..
          cmake --build . --target install --config Release
          cd ../example/java
          mkdir build
          cd build
          cmake -A ARM64 -DCMAKE_INSTALL_PREFIX:PATH=../../../tdlib -DCMAKE_TOOLCHAIN_FILE:FILEPATH=../../../../vcpkg/scripts/buildsystems/vcpkg.cmake -DTd_DIR:PATH=$(Resolve-Path ../td/lib/cmake/Td) -DTD_JSON_JAVA=ON -DCMAKE_SHARED_LINKER_FLAGS="/Brepro" ..
          cmake --build . --target install --config Release

      - name: Copy files
        run: |
          Remove-Item -ErrorAction SilentlyContinue -Recurse tdl-coroutines/generated/jvm/windows/arm64
          New-Item -Force -ItemType Directory -Path tdl-coroutines/generated/jvm/windows/arm64
          Copy-Item td/tdlib/bin/*.dll -Destination tdl-coroutines/generated/jvm/windows/arm64

      - name: SHA256 checksums
        run: Get-FileHash tdl-coroutines/generated/jvm/windows/arm64/*.dll -Algorithm SHA256

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Verify
        run: ./gradlew.bat :example:verification:app:jvm:run

      - name: Commit and push
        if: github.event_name == 'push' || inputs.commit
        uses: ./.github/actions/commit-and-push
        with:
          message: TDLib for JVM Windows ARM64
          add: tdl-coroutines

  build-jvm-windows-x64:
    name: Build JVM Windows x64
    if: github.event_name == 'push' || inputs.build-jvm
    needs: run-generator
    runs-on: windows-2025
    permissions:
      contents: write

    env:
      SOURCE_DATE_EPOCH: "1"
      VCPKG_KEEP_ENV_VARS: "SOURCE_DATE_EPOCH"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TDL_CHECKOUT_REF }}
          lfs: true
          submodules: true

      - name: Apply generated API
        if: github.event_name == 'workflow_dispatch' && inputs.commit == false
        uses: ./.github/actions/apply-generated-api

      - name: Set up dependencies
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.bat
          $triplet = "triplets/x64-windows.cmake"
          Add-Content $triplet "`nset(VCPKG_LINKER_FLAGS `"/Brepro`")"
          ./vcpkg.exe install gperf:x64-windows openssl:x64-windows zlib:x64-windows

      - name: Build TDLib
        run: |
          cd td
          mkdir build
          cd build
          cmake -A x64 -DCMAKE_INSTALL_PREFIX:PATH=../example/java/td -DTD_ENABLE_JNI=ON -DCMAKE_TOOLCHAIN_FILE:FILEPATH=../../vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_SHARED_LINKER_FLAGS="/Brepro" ..
          cmake --build . --target install --config Release
          cd ../example/java
          mkdir build
          cd build
          cmake -A x64 -DCMAKE_INSTALL_PREFIX:PATH=../../../tdlib -DCMAKE_TOOLCHAIN_FILE:FILEPATH=../../../../vcpkg/scripts/buildsystems/vcpkg.cmake -DTd_DIR:PATH=$(Resolve-Path ../td/lib/cmake/Td) -DTD_JSON_JAVA=ON -DCMAKE_SHARED_LINKER_FLAGS="/Brepro" ..
          cmake --build . --target install --config Release

      - name: Copy files
        run: |
          Remove-Item -ErrorAction SilentlyContinue -Recurse tdl-coroutines/generated/jvm/windows/x64
          New-Item -Force -ItemType Directory -Path tdl-coroutines/generated/jvm/windows/x64
          Copy-Item td/tdlib/bin/*.dll -Destination tdl-coroutines/generated/jvm/windows/x64

      - name: SHA256 checksums
        run: Get-FileHash tdl-coroutines/generated/jvm/windows/x64/*.dll -Algorithm SHA256

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Verify
        run: ./gradlew.bat :example:verification:app:jvm:run

      - name: Commit and push
        if: github.event_name == 'push' || inputs.commit
        uses: ./.github/actions/commit-and-push
        with:
          message: TDLib for JVM Windows x64
          add: tdl-coroutines

  build-windows-x64:
    name: Build Windows x64
    if: github.event_name == 'push' || inputs.build-windows
    needs: run-generator
    runs-on: windows-2025
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TDL_CHECKOUT_REF }}
          lfs: true
          submodules: true

      - name: Apply generated API
        if: github.event_name == 'workflow_dispatch' && inputs.commit == false
        uses: ./.github/actions/apply-generated-api

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Download Kotlin/Native toolchain
        run: ./gradlew.bat :tdl-coroutines:cinteropMainMingwX64

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gperf
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-zlib

      - name: Build TDLib Native
        shell: msys2 {0}
        run: |
          KONAN_DIRECTORY="$(cygpath -u "$USERPROFILE")/.konan"
          KONAN_PROPERTIES="$(find "$KONAN_DIRECTORY" -path "*/konan/konan.properties" -print -quit)"
          KONAN_MINGW_NAME="$(sed -n 's/^toolchainDependency.mingw_x64 = //p' "$KONAN_PROPERTIES")"
          KONAN_LLVM_NAME="$(sed -n 's/^llvm.mingw_x64.user=//p' "$KONAN_PROPERTIES")"
          KONAN_MINGW="$KONAN_DIRECTORY/dependencies/$KONAN_MINGW_NAME"
          KONAN_LLVM="$KONAN_DIRECTORY/dependencies/$KONAN_LLVM_NAME"
          KONAN_CLANG="$KONAN_LLVM/bin/clang.exe"
          KONAN_SSP="$(find "$KONAN_MINGW/lib/gcc" -name libssp.a -print -quit)"
          if [ ! -x "$KONAN_CLANG" ]; then
            KONAN_CLANG="$(find "$KONAN_LLVM/bin" -name "clang-[0-9]*.exe" -print -quit)"
          fi

          test -n "$KONAN_CLANG"
          test -x "$KONAN_CLANG"
          test -n "$KONAN_SSP"
          KONAN_SSP="$(cygpath -m "$KONAN_SSP")"
          KONAN_LINKER_FLAGS="-fuse-ld=bfd -Wl,--whole-archive,$KONAN_SSP,--no-whole-archive"
          export PATH="$KONAN_LLVM/bin:$KONAN_MINGW/bin:$PATH"
          "$KONAN_CLANG" --version

          cd td
          mkdir build
          cd build
          cmake \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX:PATH=../tdlib \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DCMAKE_C_FLAGS="-std=gnu17 -fno-stack-protector" \
            -DCMAKE_CXX_FLAGS="--driver-mode=g++ -fno-stack-protector" \
            -DCMAKE_EXE_LINKER_FLAGS="$KONAN_LINKER_FLAGS" \
            -DCMAKE_SHARED_LINKER_FLAGS="$KONAN_LINKER_FLAGS" \
            -DCMAKE_MODULE_LINKER_FLAGS="$KONAN_LINKER_FLAGS" \
            -DCMAKE_C_COMPILER="$KONAN_CLANG" \
            -DCMAKE_CXX_COMPILER="$KONAN_CLANG" \
            -DCMAKE_C_COMPILER_TARGET=x86_64-pc-windows-gnu \
            -DCMAKE_CXX_COMPILER_TARGET=x86_64-pc-windows-gnu \
            -DCMAKE_SYSROOT="$KONAN_MINGW" \
            -DCMAKE_AR="$KONAN_MINGW/bin/gcc-ar.exe" \
            -DCMAKE_RANLIB="$KONAN_MINGW/bin/gcc-ranlib.exe" \
            ..
          cmake --build . --target install

      - name: Copy files
        shell: msys2 {0}
        run: |
          DEST="tdl-coroutines/generated/windows/x64"
          rm -rf "$DEST"
          mkdir -p "$DEST/include/td/telegram"
          mkdir -p "$DEST/libs"
          
          cp td/tdlib/include/td/telegram/td_json_client.h "$DEST/include/td/telegram/"
          cp td/tdlib/include/td/telegram/tdjson_export.h "$DEST/include/td/telegram/"
          find td/tdlib/lib/ -name "*.a" ! -name "libtdjson.dll.a" -exec cp {} "$DEST/libs/" \;
          cp /mingw64/lib/libssl.a "$DEST/libs/"
          cp /mingw64/lib/libcrypto.a "$DEST/libs/"
          cp /mingw64/lib/libz.a "$DEST/libs/"

      - name: SHA256 checksums
        shell: msys2 {0}
        run: |
          sha256sum tdl-coroutines/generated/windows/x64/libs/*.a

      - name: Clean bootstrap outputs
        run: ./gradlew.bat :tdl-coroutines:clean

      - name: Verify
        run: ./gradlew.bat :example:verification:app:windows:runReleaseExecutableMingwX64

      - name: Commit and push
        if: github.event_name == 'push' || inputs.commit
        uses: ./.github/actions/commit-and-push
        with:
          message: TDLib for Windows x64
          add: tdl-coroutines

