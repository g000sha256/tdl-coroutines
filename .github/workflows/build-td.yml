name: Build TDLib

on:
  push:
    branches:
      - build-td
    paths:
      - td

  workflow_dispatch:
    inputs:
      build-android:
        description: 'Build Android'
        required: false
        type: boolean
        default: false

      build-jvm:
        description: 'Build JVM'
        required: false
        type: boolean
        default: false

      build-ios:
        description: 'Build iOS'
        required: false
        type: boolean
        default: false

      build-macos:
        description: 'Build macOS'
        required: false
        type: boolean
        default: false

      build-linux:
        description: 'Build Linux'
        required: false
        type: boolean
        default: false

      build-windows:
        description: 'Build Windows'
        required: false
        type: boolean
        default: false

jobs:
  run-generator:
    name: Run generator
    if: false
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: true

      - name: Clean submodule
        run: |
          cd td
          git clean -ffdx

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Assemble generator
        run: ./gradlew :tdl-coroutines-generator:assemble

      - name: Run generator
        run: ./gradlew :tdl-coroutines-generator:run

      - name: Dump API
        run: ./gradlew :tdl-coroutines:updateKotlinAbi

      - name: Commit and push
        uses: ./.github/actions/commit-and-push
        with:
          message: Update API
          add: |
            - tdl-coroutines
            - README.md

  build-android:
    name: Build Android
    if: github.event_name == 'push' || inputs.build-android
    needs: run-generator
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          lfs: true
          submodules: true

      - name: Clean submodule
        run: |
          cd td
          git clean -ffdx

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Set up dependencies
        run: brew install cmake coreutils gperf openssl php

      - name: Check environment
        run: |
          cd td/example/android
          ./check-environment.sh

      - name: Fetch Android SDK
        run: |
          cd td/example/android
          ./fetch-sdk.sh

      - name: Build OpenSSL
        run: |
          cd td/example/android
          ./build-openssl.sh

      - name: Build TDLib
        run: |
          cd td/example/android
          ./build-tdlib.sh '' '' '' '' 'JSONJava'

      - name: Copy files
        run: |
          rm -rf tdl-coroutines/generated/android
          mkdir -p tdl-coroutines/generated/android
          cp -r td/example/android/tdlib/libs/* tdl-coroutines/generated/android

      - name: SHA256 checksums
        run: shasum -a 256 tdl-coroutines/generated/android/*/*.so

      - name: Verify
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: arm64-v8a
          script: bash .github/scripts/verify-android.sh

      - name: Commit and push
        uses: ./.github/actions/commit-and-push
        with:
          message: TDLib for Android
          add: tdl-coroutines

  build-jvm-linux-arm64:
    name: Build JVM Linux ARM64
    if: github.event_name == 'push' || inputs.build-jvm
    needs: run-generator
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          lfs: true
          submodules: true

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          tools: none

      - name: Set up dependencies
        run: sudo apt-get install make git zlib1g-dev libssl-dev gperf cmake g++

      - name: Build TDLib
        run: |
          cd td
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=../example/java/td -DTD_ENABLE_JNI=ON ..
          cmake --build . --target install
          cd ../example/java
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=../../../tdlib -DTd_DIR:PATH=$(readlink -e ../td/lib/cmake/Td) -DTD_JSON_JAVA=ON ..
          cmake --build . --target install

      - name: Copy files
        run: |
          rm -rf tdl-coroutines/generated/jvm/linux/arm64
          mkdir -p tdl-coroutines/generated/jvm/linux/arm64
          cp td/tdlib/bin/*.so tdl-coroutines/generated/jvm/linux/arm64

      - name: SHA256 checksums
        run: shasum -a 256 tdl-coroutines/generated/jvm/linux/arm64/*.so

      - name: Verify
        run: ./gradlew :example:verification:app:jvm:run

      - name: Commit and push
        uses: ./.github/actions/commit-and-push
        with:
          message: TDLib for JVM Linux ARM64
          add: tdl-coroutines

  build-jvm-linux-x64:
    name: Build JVM Linux x64
    if: github.event_name == 'push' || inputs.build-jvm
    needs: run-generator
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          lfs: true
          submodules: true

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          tools: none

      - name: Set up dependencies
        run: sudo apt-get install make git zlib1g-dev libssl-dev gperf cmake g++

      - name: Build TDLib
        run: |
          cd td
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=../example/java/td -DTD_ENABLE_JNI=ON ..
          cmake --build . --target install
          cd ../example/java
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=../../../tdlib -DTd_DIR:PATH=$(readlink -e ../td/lib/cmake/Td) -DTD_JSON_JAVA=ON ..
          cmake --build . --target install

      - name: Copy files
        run: |
          rm -rf tdl-coroutines/generated/jvm/linux/x64
          mkdir -p tdl-coroutines/generated/jvm/linux/x64
          cp td/tdlib/bin/*.so tdl-coroutines/generated/jvm/linux/x64

      - name: SHA256 checksums
        run: shasum -a 256 tdl-coroutines/generated/jvm/linux/x64/*.so

      - name: Verify
        run: ./gradlew :example:verification:app:jvm:run

      - name: Commit and push
        uses: ./.github/actions/commit-and-push
        with:
          message: TDLib for JVM Linux x64
          add: tdl-coroutines

  build-jvm-macos-arm64:
    name: Build JVM macOS ARM64
    if: github.event_name == 'push' || inputs.build-jvm
    needs: run-generator
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          lfs: true
          submodules: true

      - name: Clean submodule
        run: |
          cd td
          git clean -ffdx

      - name: Set up dependencies
        run: brew install gperf cmake openssl coreutils openjdk

      - name: Build TDLib
        run: |
          cd td
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DJAVA_HOME=/opt/homebrew/opt/openjdk/libexec/openjdk.jdk/Contents/Home/ -DOPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl/ -DCMAKE_INSTALL_PREFIX:PATH=../example/java/td -DTD_ENABLE_JNI=ON ..
          cmake --build . --target install
          cd ../example/java
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DJAVA_HOME=/opt/homebrew/opt/openjdk/libexec/openjdk.jdk/Contents/Home/ -DCMAKE_INSTALL_PREFIX:PATH=../../../tdlib -DTd_DIR:PATH=$(greadlink -e ../td/lib/cmake/Td) -DTD_JSON_JAVA=ON ..
          cmake --build . --target install

      - name: Copy files
        run: |
          rm -rf tdl-coroutines/generated/jvm/macos/arm64
          mkdir -p tdl-coroutines/generated/jvm/macos/arm64
          cp td/tdlib/bin/*.dylib tdl-coroutines/generated/jvm/macos/arm64

      - name: SHA256 checksums
        run: shasum -a 256 tdl-coroutines/generated/jvm/macos/arm64/*.dylib

      - name: Verify
        run: ./gradlew :example:verification:app:jvm:run

      - name: Commit and push
        uses: ./.github/actions/commit-and-push
        with:
          message: TDLib for JVM macOS ARM64
          add: tdl-coroutines

  build-jvm-macos-x64:
    name: Build JVM macOS x64
    if: github.event_name == 'push' || inputs.build-jvm
    needs: run-generator
    runs-on: macos-15-intel
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          lfs: true
          submodules: true

      - name: Set up dependencies
        run: brew install gperf cmake openssl coreutils openjdk

      - name: Build TDLib
        run: |
          cd td
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DJAVA_HOME=/usr/local/opt/openjdk/libexec/openjdk.jdk/Contents/Home/ -DOPENSSL_ROOT_DIR=/usr/local/opt/openssl/ -DCMAKE_INSTALL_PREFIX:PATH=../example/java/td -DTD_ENABLE_JNI=ON ..
          cmake --build . --target install
          cd ../example/java
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DJAVA_HOME=/usr/local/opt/openjdk/libexec/openjdk.jdk/Contents/Home/ -DCMAKE_INSTALL_PREFIX:PATH=../../../tdlib -DTd_DIR:PATH=$(greadlink -e ../td/lib/cmake/Td) -DTD_JSON_JAVA=ON ..
          cmake --build . --target install

      - name: Copy files
        run: |
          rm -rf tdl-coroutines/generated/jvm/macos/x64
          mkdir -p tdl-coroutines/generated/jvm/macos/x64
          cp td/tdlib/bin/*.dylib tdl-coroutines/generated/jvm/macos/x64

      - name: SHA256 checksums
        run: shasum -a 256 tdl-coroutines/generated/jvm/macos/x64/*.dylib

      - name: Verify
        run: ./gradlew :example:verification:app:jvm:run

      - name: Commit and push
        uses: ./.github/actions/commit-and-push
        with:
          message: TDLib for JVM macOS x64
          add: tdl-coroutines

  build-jvm-windows-arm64:
    name: Build JVM Windows ARM64
    if: github.event_name == 'push' || inputs.build-jvm
    needs: run-generator
    runs-on: windows-11-arm
    permissions:
      contents: write

    env:
      SOURCE_DATE_EPOCH: "1"
      VCPKG_KEEP_ENV_VARS: "SOURCE_DATE_EPOCH"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          lfs: true
          submodules: true

      - name: Set up dependencies
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.bat
          $triplet = "triplets/arm64-windows.cmake"
          Add-Content $triplet "`nset(VCPKG_LINKER_FLAGS `"/Brepro`")"
          ./vcpkg.exe install gperf:arm64-windows openssl:arm64-windows zlib:arm64-windows

      - name: Build TDLib
        run: |
          cd td
          mkdir build
          cd build
          cmake -A ARM64 -DCMAKE_INSTALL_PREFIX:PATH=../example/java/td -DTD_ENABLE_JNI=ON -DCMAKE_TOOLCHAIN_FILE:FILEPATH=../../vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_SHARED_LINKER_FLAGS="/Brepro" ..
          cmake --build . --target install --config Release
          cd ../example/java
          mkdir build
          cd build
          cmake -A ARM64 -DCMAKE_INSTALL_PREFIX:PATH=../../../tdlib -DCMAKE_TOOLCHAIN_FILE:FILEPATH=../../../../vcpkg/scripts/buildsystems/vcpkg.cmake -DTd_DIR:PATH=$(Resolve-Path ../td/lib/cmake/Td) -DTD_JSON_JAVA=ON -DCMAKE_SHARED_LINKER_FLAGS="/Brepro" ..
          cmake --build . --target install --config Release

      - name: Copy files
        run: |
          Remove-Item -ErrorAction SilentlyContinue -Recurse tdl-coroutines/generated/jvm/windows/arm64
          New-Item -Force -ItemType Directory -Path tdl-coroutines/generated/jvm/windows/arm64
          Copy-Item td/tdlib/bin/*.dll -Destination tdl-coroutines/generated/jvm/windows/arm64

      - name: SHA256 checksums
        run: Get-FileHash tdl-coroutines/generated/jvm/windows/arm64/*.dll -Algorithm SHA256

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Verify
        run: ./gradlew.bat :example:verification:app:jvm:run

      - name: Commit and push
        uses: ./.github/actions/commit-and-push
        with:
          message: TDLib for JVM Windows ARM64
          add: tdl-coroutines

  build-jvm-windows-x64:
    name: Build JVM Windows x64
    if: github.event_name == 'push' || inputs.build-jvm
    needs: run-generator
    runs-on: windows-2025
    permissions:
      contents: write

    env:
      SOURCE_DATE_EPOCH: "1"
      VCPKG_KEEP_ENV_VARS: "SOURCE_DATE_EPOCH"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          lfs: true
          submodules: true

      - name: Set up dependencies
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.bat
          $triplet = "triplets/x64-windows.cmake"
          Add-Content $triplet "`nset(VCPKG_LINKER_FLAGS `"/Brepro`")"
          ./vcpkg.exe install gperf:x64-windows openssl:x64-windows zlib:x64-windows

      - name: Build TDLib
        run: |
          cd td
          mkdir build
          cd build
          cmake -A x64 -DCMAKE_INSTALL_PREFIX:PATH=../example/java/td -DTD_ENABLE_JNI=ON -DCMAKE_TOOLCHAIN_FILE:FILEPATH=../../vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_SHARED_LINKER_FLAGS="/Brepro" ..
          cmake --build . --target install --config Release
          cd ../example/java
          mkdir build
          cd build
          cmake -A x64 -DCMAKE_INSTALL_PREFIX:PATH=../../../tdlib -DCMAKE_TOOLCHAIN_FILE:FILEPATH=../../../../vcpkg/scripts/buildsystems/vcpkg.cmake -DTd_DIR:PATH=$(Resolve-Path ../td/lib/cmake/Td) -DTD_JSON_JAVA=ON -DCMAKE_SHARED_LINKER_FLAGS="/Brepro" ..
          cmake --build . --target install --config Release

      - name: Copy files
        run: |
          Remove-Item -ErrorAction SilentlyContinue -Recurse tdl-coroutines/generated/jvm/windows/x64
          New-Item -Force -ItemType Directory -Path tdl-coroutines/generated/jvm/windows/x64
          Copy-Item td/tdlib/bin/*.dll -Destination tdl-coroutines/generated/jvm/windows/x64

      - name: SHA256 checksums
        run: Get-FileHash tdl-coroutines/generated/jvm/windows/x64/*.dll -Algorithm SHA256

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Verify
        run: ./gradlew.bat :example:verification:app:jvm:run

      - name: Commit and push
        uses: ./.github/actions/commit-and-push
        with:
          message: TDLib for JVM Windows x64
          add: tdl-coroutines

  build-linux-x64:
    name: Build Linux x64
    if: github.event_name == 'push' || inputs.build-linux
#    needs: run-generator
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          lfs: true
          submodules: true

      - name: Checkout OpenSSL
        uses: actions/checkout@v4
        with:
          repository: openssl/openssl
          ref: openssl-3.0.16
          path: native-dependencies/openssl

      - name: Checkout zlib
        uses: actions/checkout@v4
        with:
          repository: madler/zlib
          ref: v1.3.1
          path: native-dependencies/zlib

      - name: Clean submodule
        run: git -C td clean -ffdx

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gperf make perl php-cli

      - name: Set up Kotlin/Native toolchain
        run: |
          ./gradlew --configure-on-demand :tdl-coroutines:downloadKotlinNativeDistribution

          KOTLIN_VERSION="$(sed -n 's/^kotlin = "\([^"]*\)"/\1/p' catalog.toml)"
          KONAN_HOME="$HOME/.konan/kotlin-native-prebuilt-linux-x86_64-$KOTLIN_VERSION"

          "$KONAN_HOME/bin/run_konan" clang clang linux_x64 --version

          KONAN_LLVM_HOME="$(find "$HOME/.konan/dependencies" -maxdepth 1 -type d -name 'llvm-*-x86_64-linux-essentials-*' -print -quit)"
          KONAN_TOOLCHAIN="$(find "$HOME/.konan/dependencies" -maxdepth 1 -type d -name 'x86_64-unknown-linux-gnu-gcc-*' -print -quit)"

          test -x "$KONAN_LLVM_HOME/bin/clang"
          test -x "$KONAN_TOOLCHAIN/x86_64-unknown-linux-gnu/bin/ar"

          echo "KONAN_LLVM_HOME=$KONAN_LLVM_HOME" >> "$GITHUB_ENV"
          echo "KONAN_TOOLCHAIN=$KONAN_TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Build OpenSSL
        run: |
          export CC="$GITHUB_WORKSPACE/.github/scripts/konan-clang-linux-x64"
          export AR="$KONAN_TOOLCHAIN/x86_64-unknown-linux-gnu/bin/ar"
          export RANLIB="$KONAN_TOOLCHAIN/x86_64-unknown-linux-gnu/bin/ranlib"

          cd native-dependencies/openssl
          ./Configure linux-x86_64 \
            no-module \
            no-shared \
            no-tests \
            --prefix="$RUNNER_TEMP/konan-native-deps" \
            --libdir=lib
          make -j"$(nproc)" build_libs
          make install_sw

      - name: Build zlib
        run: |
          cmake -S native-dependencies/zlib -B native-dependencies/zlib/build-linux-x64 \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/konan-native-deps" \
            -DCMAKE_C_COMPILER="$GITHUB_WORKSPACE/.github/scripts/konan-clang-linux-x64" \
            -DCMAKE_AR="$KONAN_TOOLCHAIN/x86_64-unknown-linux-gnu/bin/ar" \
            -DCMAKE_RANLIB="$KONAN_TOOLCHAIN/x86_64-unknown-linux-gnu/bin/ranlib" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DZLIB_BUILD_EXAMPLES=OFF
          cmake --build native-dependencies/zlib/build-linux-x64 --target install --parallel

      - name: Build TDLib
        run: |
          cmake -S td -B td/build-linux-x64 \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/tdlib-linux-x64" \
            -DCMAKE_C_COMPILER="$GITHUB_WORKSPACE/.github/scripts/konan-clang-linux-x64" \
            -DCMAKE_CXX_COMPILER="$GITHUB_WORKSPACE/.github/scripts/konan-clangxx-linux-x64" \
            -DCMAKE_AR="$KONAN_TOOLCHAIN/x86_64-unknown-linux-gnu/bin/ar" \
            -DCMAKE_RANLIB="$KONAN_TOOLCHAIN/x86_64-unknown-linux-gnu/bin/ranlib" \
            -DOPENSSL_INCLUDE_DIR="$RUNNER_TEMP/konan-native-deps/include" \
            -DOPENSSL_SSL_LIBRARY="$RUNNER_TEMP/konan-native-deps/lib/libssl.a" \
            -DOPENSSL_CRYPTO_LIBRARY="$RUNNER_TEMP/konan-native-deps/lib/libcrypto.a" \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DZLIB_INCLUDE_DIR="$RUNNER_TEMP/konan-native-deps/include" \
            -DZLIB_LIBRARY="$RUNNER_TEMP/konan-native-deps/lib/libz.a" \
            -DTD_INSTALL_SHARED_LIBRARIES=OFF \
            -DTD_INSTALL_STATIC_LIBRARIES=ON \
            -DBUILD_TESTING=OFF
          cmake --build td/build-linux-x64 --target install --parallel

      - name: Copy files
        run: |
          DEST="tdl-coroutines/generated/linux/x64"
          rm -rf "$DEST"
          mkdir -p "$DEST/include/td/telegram" "$DEST/libs"

          cp "$RUNNER_TEMP/tdlib-linux-x64/include/td/telegram/td_json_client.h" "$DEST/include/td/telegram/"
          cp "$RUNNER_TEMP/tdlib-linux-x64/include/td/telegram/tdjson_export.h" "$DEST/include/td/telegram/"

          for archive in \
            libtdjson_static.a \
            libtdjson_private.a \
            libtdclient.a \
            libtdcore.a \
            libtdapi.a \
            libtdactor.a \
            libtddb.a \
            libtde2e.a \
            libtdmtproto.a \
            libtdnet.a \
            libtdsqlite.a \
            libtdutils.a
          do
            cp "$RUNNER_TEMP/tdlib-linux-x64/lib/$archive" "$DEST/libs/"
          done

          cp "$RUNNER_TEMP/konan-native-deps/lib/libssl.a" "$DEST/libs/"
          cp "$RUNNER_TEMP/konan-native-deps/lib/libcrypto.a" "$DEST/libs/"
          cp "$RUNNER_TEMP/konan-native-deps/lib/libz.a" "$DEST/libs/"

      - name: SHA256 checksums
        run: shasum -a 256 tdl-coroutines/generated/linux/x64/libs/*.a

      - name: Verify
        run: ./gradlew :example:verification:app:linux:runReleaseExecutableLinuxX64

      - name: Commit and push
        uses: ./.github/actions/commit-and-push
        with:
          message: TDLib for Linux x64
          add: tdl-coroutines

  build-windows-x64:
    name: Build Windows x64
    if: github.event_name == 'push' || inputs.build-windows
    needs: run-generator
    runs-on: windows-2025
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          lfs: true
          submodules: true

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gperf
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-zlib

      - name: Build TDLib Native
        shell: msys2 {0}
        run: |
          cd td
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=../tdlib -DOPENSSL_USE_STATIC_LIBS=TRUE -DCMAKE_C_FLAGS=-std=gnu17 ..
          cmake --build . --target install

      - name: Copy files
        shell: msys2 {0}
        run: |
          DEST="tdl-coroutines/generated/windows/x64"
          rm -rf "$DEST"
          mkdir -p "$DEST/include/td/telegram"
          mkdir -p "$DEST/libs"
          
          cp td/tdlib/include/td/telegram/td_json_client.h "$DEST/include/td/telegram/"
          cp td/tdlib/include/td/telegram/tdjson_export.h "$DEST/include/td/telegram/"
          find td/tdlib/lib/ -name "*.a" ! -name "libtdjson.dll.a" -exec cp {} "$DEST/libs/" \;
          cp /mingw64/lib/libssl.a "$DEST/libs/"
          cp /mingw64/lib/libcrypto.a "$DEST/libs/"
          cp /mingw64/lib/libz.a "$DEST/libs/"

      - name: SHA256 checksums
        shell: msys2 {0}
        run: |
          sha256sum tdl-coroutines/generated/windows/x64/libs/*.a

      - name: Set up Java
