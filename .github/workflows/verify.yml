name: Verify

on:
  workflow_dispatch:

jobs:
  verify-android:
    name: Verify Android
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Verify
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: arm64-v8a
          script: bash .github/scripts/verify-android.sh

  verify-ios:
    name: Verify iOS Simulator ARM64
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Verify
        run: ./gradlew :example:verification:app:ios:iosSimulatorArm64Test

  verify-jvm:
    name: Verify JVM ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux ARM64
            runner: ubuntu-22.04-arm
            gradle: ./gradlew

          - platform: Linux x64
            runner: ubuntu-22.04
            gradle: ./gradlew

          - platform: macOS ARM64
            runner: self-hosted
            gradle: ./gradlew

          - platform: macOS x64
            runner: macos-26-intel
            gradle: ./gradlew

          - platform: Windows ARM64
            runner: windows-11-arm
            gradle: ./gradlew.bat

          - platform: Windows x64
            runner: windows-2025
            gradle: ./gradlew.bat

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Verify
        run: ${{ matrix.gradle }} :example:verification:app:jvm:run

  verify-macos:
    name: Verify macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ARM64
            runner: self-hosted
            task: runReleaseExecutableMacosArm64

          - arch: x64
            runner: macos-26-intel
            task: runReleaseExecutableMacosX64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Verify
        run: bash ./gradlew ":example:verification:app:macos:${{ matrix.task }}"

  verify-windows:
    name: Verify Windows x64
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java
        uses: ./.github/actions/set-up-java

      - name: Verify
        run: ./gradlew.bat :example:verification:app:windows:runReleaseExecutableMingwX64
